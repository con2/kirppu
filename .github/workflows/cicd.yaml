name: cicd

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: &checkout-action actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: &buildx-action docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: docker compose -f docker-compose.test.yml up --exit-code-from test

  build:
    runs-on: ubuntu-latest
    env:
      SKAFFOLD_DEFAULT_REPO: ghcr.io/con2
    steps:
      - uses: *checkout-action
      - uses: &python-action actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: ./.github/cache-tools
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: *buildx-action
      - id: build
        run: |
          python3 -m pip install emskaffolden

          # Do not push to registry on pull request events
          if [ "${{ github.event_name }}" = pull_request ]; then
            EMSKAFFOLDEN_ENV=pull_request
          else
            EMSKAFFOLDEN_ENV=default
          fi

          emskaffolden -E "$EMSKAFFOLDEN_ENV" -- build --file-output build.json
          echo "build_json=$(base64 -w 0 < build.json)" >> "$GITHUB_OUTPUT"
    outputs:
      build_json: ${{ steps.build.outputs.build_json }}

  # TODO DRY
  deploy_staging:
    runs-on: qb-arc-runners
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    steps:
      - uses: *checkout-action
      - uses: *python-action
        with:
          python-version: '3.11'
      - uses: ./.github/cache-tools
      - run: |
          python3 -m pip install emskaffolden
          base64 -d <<< "${{ needs.build.outputs.build_json }}" > build.json
          emskaffolden -E staging -- deploy -n kirppu-staging -a build.json

  deploy_production:
    runs-on: qb-arc-runners
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: *checkout-action
      - uses: *python-action
        with:
          python-version: '3.11'
      - uses: ./.github/cache-tools
      - run: |
          python3 -m pip install emskaffolden
          base64 -d <<< "${{ needs.build.outputs.build_json }}" > build.json
          emskaffolden -E production -- deploy -n kirppu -a build.json
